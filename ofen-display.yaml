                  if(!std::isnan(d.neu_flamme)){id(ofen_bus).send_cmd('K',"flamme_aus_c",std::to_string(d.neu_flamme));d.alt_flamme=d.neu_flamme;d.neu_flamme=NAN;}
                  if(d.sprung_ergebnis.ok){id(kp).publish_state(d.sprung_ergebnis.kp);id(ti).publish_state(d.sprung_ergebnis.ti_min);d.sprung_ergebnis.ok=false;}
        - button: {x: 640, y: 246, width: 128, height: 70, styles: stil_ghost, widgets: [{label: {align: CENTER, text: ALT}}], on_click: [{lambda: 'auto &d=esphome::ofen_link::display_runtime;id(ofen_bus).send_cmd(''K'',"min_pwm",std::to_string(d.alt_min_pwm));id(ofen_bus).send_cmd(''K'',"max_pwm",std::to_string(d.alt_max_pwm));id(ofen_bus).send_cmd(''K'',"flamme_aus_c",std::to_string(d.alt_flamme));'}]}
        - button: {x: 32, y: 400, width: 144, height: 64, styles: stil_ghost, widgets: [{label: {align: CENTER, text: Zurück}}], on_click: [{lvgl.page.show: einstellung_seite}]}
